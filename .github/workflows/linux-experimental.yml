name: Linux experimental build

on:
  push:
    branches: [linux-optimization]
  workflow_dispatch:

jobs:
  linux-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config \
            libssl-dev libopus-dev libavcodec-dev libavutil-dev \
            libavformat-dev libswscale-dev libjson-c-dev libcurl4-openssl-dev \
            libudev-dev python3-protobuf protobuf-compiler libprotobuf-dev libprotobuf-c-dev libminiupnpc-dev libevent-dev \
            libjerasure-dev libnanopb-dev libspeexdsp-dev meson python3-mako \
            qt6-base-dev qt6-base-private-dev qt6-declarative-dev qt6-svg-dev qt6-tools-dev \
            libqt6opengl6-dev libsdl2-dev libplacebo-dev libavdevice-dev
      - name: Build libplacebo 7.349.0 for the GUI
        run: |
          git clone --depth 1 --branch v7.349.0 https://code.videolan.org/videolan/libplacebo.git /tmp/libplacebo
          git -C /tmp/libplacebo submodule update --init --recursive
          meson setup /tmp/libplacebo-build /tmp/libplacebo --prefix=/usr/local -Dvulkan=disabled -Dopengl=enabled -Ddemos=false -Dtests=false
          meson compile -C /tmp/libplacebo-build
          sudo meson install -C /tmp/libplacebo-build
          sudo ldconfig
          pkg-config --modversion libplacebo
      - name: Configure Linux GUI build
        run: |
          cmake -S . -B build-linux -G Ninja \
            -DCHIAKI_ENABLE_GUI=ON \
            -DCHIAKI_ENABLE_BOREALIS=OFF \
            -DCHIAKI_ENABLE_TESTS=OFF \
            -DCHIAKI_ENABLE_CLI=OFF \
            -DCHIAKI_ENABLE_FFMPEG_DECODER=ON \
            -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF \
            -DCHIAKI_ENABLE_SETSU=OFF \
            -DCHIAKI_ENABLE_SPEEX=OFF \
            -DCHIAKI_ENABLE_RUDP=OFF \
            -DCHIAKI_ENABLE_STEAM_SHORTCUT=OFF \
            -DCHIAKI_ENABLE_PI_DECODER=OFF
      - name: Compile Linux GUI
        run: cmake --build build-linux --parallel 2
      - name: Prepare AppDir
        run: |
          DESTDIR="$PWD/AppDir" cmake --install build-linux --prefix /usr
          mkdir -p AppDir/usr/lib
          cp -a /usr/local/lib/x86_64-linux-gnu/libplacebo.so* AppDir/usr/lib/ 2>/dev/null || \
            cp -a /usr/local/lib/libplacebo.so* AppDir/usr/lib/
          test -f AppDir/usr/bin/chiaki
          test -f AppDir/usr/share/applications/chiaking.desktop
      - name: Build AppImage
        env:
          ARCH: x86_64
          OUTPUT: chiaki-ng-linux-experimental-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          curl -fL --retry 3 -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fL --retry 3 -o linuxdeploy-plugin-qt.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage
          export PATH="$PWD:$PATH"
          export QML_SOURCES_PATHS="$PWD/gui/src/qml"
          export LD_LIBRARY_PATH="/usr/local/lib/x86_64-linux-gnu:/usr/local/lib:${LD_LIBRARY_PATH:-}"
          ./linuxdeploy.AppImage --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/chiaking.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/512x512/apps/chiaking.png \
            --plugin qt --output appimage
          test -s "$OUTPUT"
      - name: Upload AppImage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-linux-experimental-AppImage
          path: chiaki-ng-linux-experimental-x86_64.AppImage
          if-no-files-found: error
